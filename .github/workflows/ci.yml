name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read   # least privilege: no write scopes, no deploy credentials in CI

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:web
      - run: npm run build
      - run: npm run functions:build
      - run: npm run test:functions
      # Rules tests need the Firebase emulator (Java 21 + network to download it).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm run test:rules
